<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Get Entry Pass</title>
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.022em;
      margin-bottom: 6px;
    }

    p {
      font-size: 13px;
      color: #8e8e93;
      line-height: 1.38;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: #f2f2f7;
      color: #000000;
      text-align: center;
      letter-spacing: 1px;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #000000;
      background: #ffffff;
    }

    .btn-submit {
      width: 100%;
      background: #000000;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-submit:active {
      opacity: 0.8;
    }

    #pass-container {
      display: none;
      margin-top: 12px;
      padding: 28px 20px;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    canvas {
      max-width: 100%;
      height: auto;
      margin-top: 16px;
    }

    .id-label {
      font-size: 14px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: 2px;
      margin-top: 12px;
    }

    #error-msg {
      color: #ff3b30;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="search-container">
      <h1>Get Entry Pass</h1>
      <p>Enter your Barcode / ID number below to generate your event ticket.</p>

      <div class="input-group">
        <input type="text" id="id-input" placeholder="Enter Registration ID" required autocomplete="off">
      </div>
      
      <button class="btn-submit" onclick="fetchPass()">View Barcode Pass</button>
      <div id="error-msg"></div>
    </div>

    <!-- Generated Pass Output -->
    <div id="pass-container">
      <h1>Event Pass</h1>
      <p>Screenshot this ticket for check-in</p>
      
      <canvas id="barcode-canvas"></canvas>
      <div class="id-label" id="id-display"></div>
    </div>
  </div>

  <script>
    // Replace with your Google Apps Script Web App Deployment URL
    const API_URL = "https://script.google.com/macros/s/AKfycbx8QgBGBW_EtkW0Ja30qbtXuovRDmiZkvWaADbaQ_XTKjZ7YLeQmApbkZHQOuYf5bl_/exec";

    async function fetchPass() {
      const id = document.getElementById('id-input').value.trim();
      const errorDiv = document.getElementById('error-msg');
      
      if (!id) {
        showError("Please enter your Registration ID.");
        return;
      }

      errorDiv.style.display = "none";

      try {
        const response = await fetch(`${API_URL}?id=${encodeURIComponent(id)}`, {
          method: "GET",
          redirect: "follow"
        });

        const data = await response.json();

        if (data.success) {
          renderBarcode(data.id);
        } else {
          showError(data.message || "Registration ID not found.");
        }
      } catch (err) {
        showError("Unable to retrieve pass. Check your connection.");
      }
    }

    function renderBarcode(id) {
      document.getElementById('search-container').style.display = "none";
      document.getElementById('pass-container').style.display = "block";
      document.getElementById('id-display').innerText = id;

      try {
        bwipjs.toCanvas('barcode-canvas', {
          bcid: 'code128',
          text: id,
          scale: 3,
          height: 12,
          includetext: false
        });
      } catch (e) {
        console.error("Barcode Generation Error:", e);
      }
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error-msg');
      errorDiv.innerText = msg;
      errorDiv.style.display = "block";
    }
  </script>
</body>
</html>
